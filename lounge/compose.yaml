services:
      
  thelounge:
    image: thelounge/thelounge:latest
    container_name: thelounge
    volumes:
      - $DOCKERDATA:/var/opt/thelounge
    restart: unless-stopped
    labels:
      - "traefik.enable=true"     
      # web      
      - "traefik.http.routers.irc-rtr.rule=Host(`irc.$DOMAINNAME`)"
      - "traefik.http.routers.irc-rtr.entrypoints=websecure"   
      - "traefik.http.routers.irc-rtr.service=irc-svc"
      - "traefik.http.services.irc-svc.loadbalancer.server.port=9000"

networks:
  default:
    external: true
    name: myNetwork
